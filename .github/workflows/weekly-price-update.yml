name: Weekly price update

on:
  schedule:
    # Monday 18:00 UTC = early morning Tue across JP/AU/SG/TW, Monday evening
    # IN. Weekly (not daily) by design: phone/device prices don't move daily,
    # and it's gentler on the retail sites being scraped. Bump to a daily
    # cron ("0 18 * * *") if you want fresher data and are comfortable with
    # the extra request volume.
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      debug_scrape:
        description: "Log verbose per-request scrape diagnostics (for debugging a source that stopped matching)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper (Google Store + best-effort competitor prices)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DEBUG_SCRAPE: ${{ inputs.debug_scrape && '1' || '' }}
        run: python3 scraper/run.py

      - name: Commit updated data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No price changes this week" && exit 0
          git commit -m "Weekly price update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
